<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 4 - Matriz Identidad</title>
    <link rel="stylesheet" href="../styles/style.css">
</head>
<body>
    <header class="main-header">
        <div class="container">
            <h1>Ejercicio 4: Generador de Matriz Identidad</h1>
            <a href="../index.html" class="btn" style="background-color: var(--secondary-color); margin-top: 10px;">&larr; Volver al Menú</a>
        </div>
    </header>

    <main class="container">
        <div class="dashboard">
            <h2>Generador de Matriz Identidad N x N</h2>
            <p>Introduce el tamaño (N) para la matriz cuadrada y presiona el botón para generarla.</p>
            
            <div class="form-group">
                <label for="identityMatrixSize">Tamaño de la matriz (N):</label>
                <input type="number" id="identityMatrixSize" placeholder="Ej: 5" min="1" max="20">
            </div>
            
            <button id="generateIdentityBtn" class="btn">Generar Matriz</button>
            
            <div id="resultArea" class="results-area" style="display: none;">
                <h3>Matriz Identidad Generada:</h3>
                <pre id="identityMatrixOutput"></pre>
            </div>
        </div>
    </main>

    <footer class="main-footer">
        <p>&copy; Arreglos - Equipo de Desarrollo</p>
    </footer>
    <script src="../scripts/ejercicio4.js" defer></script>
</body>
</html>
