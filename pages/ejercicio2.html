<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 2 - Cuadrado Mágico</title>
    <!-- Ruta corregida a la hoja de estilos global -->
    <link rel="stylesheet" href="../styles/style.css">
    <style>
        /* Estilos específicos para este dashboard */
        #matrixGrid {
            display: grid;
            gap: 10px;
            margin-top: 20px;
            justify-content: center; /* Centra el grid */
        }
        #matrixGrid input {
            width: 60px;
            height: 60px;
            text-align: center;
            font-size: 1.2rem;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <header class="main-header">
        <div class="container">
            <h1>Ejercicio 2: Validador de Cuadrado Mágico</h1>
            <!-- Ruta corregida para volver al menú principal -->
            <a href="../index.html" class="btn" style="background-color: var(--secondary-color); margin-top: 10px;">&larr; Volver al Menú</a>
        </div>
    </header>

    <main class="container">
        <div class="dashboard">
            <h2>Introduce los datos de la matriz</h2>
            <p>Define el tamaño de la matriz y luego llena las casillas con números.</p>
            
            <div class="form-group">
                <label for="matrixSize">Tamaño de la matriz (N x N):</label>
                <input type="number" id="matrixSize" placeholder="Ej: 3" min="2" class="form-control">
            </div>
            <button id="generateGridBtn" class="btn">Generar Matriz</button>
            
            <!-- El grid de la matriz se generará dinámicamente aquí -->
            <div id="matrixGrid"></div>

            <!-- Contenedor para el botón de validación, se muestra después de generar el grid -->
            <div id="actionContainer" style="display: none; margin-top: 20px;">
                <button id="validateBtn" class="btn">Validar Cuadrado Mágico</button>
            </div>
            
            <!-- Área para mostrar el resultado -->
            <div id="resultArea" class="results-area" style="display: none;">
                <h3>Resultado:</h3>
                <p id="resultText"></p>
            </div>
        </div>
    </main>

    <footer class="main-footer">
        <p>&copy; 2024 - Equipo de Desarrollo</p>
    </footer>

    <!-- Ruta corregida al script de lógica, con 'defer' para mejor rendimiento -->
    <script src="../scripts/ejercicio2.js" defer></script>
</body>
</html>
